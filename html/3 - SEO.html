</-- SEO - Search Engine Optimization -->

otimização dos motores de busca (SEO) é o processo de melhorar a visibilidade de um site ou página da web nos resultados
orgânicos dos motores de busca. O objetivo do SEO é aumentar o tráfego qualificado para um site, melhorando sua posição
nos resultados de pesquisa para palavras-chave relevantes.
